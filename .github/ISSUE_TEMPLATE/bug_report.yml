name: Bug report
description: Report a reproducible problem in HyperION
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve HyperION. Do not include license data, personal information, private project files, or sensitive security details.
  - type: input
    id: version
    attributes:
      label: HyperION version
      description: Find the version in HyperION's About or version information.
      placeholder: "Example: 1.1.5.0"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Demo
        - Standard
        - Ultimate
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Installation source
      options:
        - Steam
        - hyperiondaw.com (Windows Setup)
        - hyperiondaw.com (macOS DMG or PKG)
        - hyperiondaw.com (Linux AppImage or .deb)
        - Microsoft Store
        - Other supported channel
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux / SteamOS
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Audio playback or audio device
        - Opening, saving or importing files
        - Exporting audio, MIDI or video
        - Recording
        - Arrangement and editing
        - MIDI, Piano Roll or Step Sequencer
        - Mixer, routing or plug-ins
        - Generators or AI tools
        - Video Editor or Photo Editor
        - Installation, updates or licence
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System and audio setup
      description: OS version, audio driver (Windows Audio, ASIO, DirectSound, Core Audio, ALSA, PipeWire), audio interface or speakers, sample rate and buffer size.
      placeholder: "Windows 11 24H2, Windows Audio, laptop speakers, 48 kHz, 512 samples"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a new project
        2. Add ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Related plugins or files
      description: List plugin names and versions or safe sample/project details, if relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Drag in sanitized logs (Windows - Documents/HYPERION/Logs), crash dumps, plug-in scan reports or screenshots. Remove personal and licensing information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I reproduced this with the latest build available to me.
          required: true
        - label: I checked existing issues for duplicates.
          required: true
        - label: This report does not contain sensitive security information.
          required: true
